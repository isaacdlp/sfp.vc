        - generic [ref=f1e93]: Investment Thesis
        - heading "Spain's Breakout Moment Is Now" [level=2] [ref=f1e94]: Spain's BreakoutMoment Is Now
        - paragraph [ref=f1e95]: A new generation of Spanish B2B companies has emerged — technically world-class, commercially proven, and fundamentally different from anything Europe has built before.
        - paragraph [ref=f1e96]: "Spanish founders carry a rare structural advantage: European product discipline and engineering depth, native fluency across 20+ LATAM markets, and a rapidly growing network of Spanish-speaking operators in the United States. This is not an emerging ecosystem — it is a breakout one. We invest at the inflection point, when traction is real and global ambition is non-negotiable."
        - generic [ref=f1e97]:
          - generic [ref=f1e102]:
            - strong [ref=f1e103]: Proven Revenue
            - text: €500K–€3M ARR with strong year-on-year growth — product-market fit is established, not hypothetical
          - generic [ref=f1e108]:
            - strong [ref=f1e109]: Transatlantic Ambition
            - text: Active expansion plans towards the US and/or Latin America with a credible go-to-market thesis
          - generic [ref=f1e114]:
            - strong [ref=f1e115]: B2B Technology
            - text: SaaS, fintech, marketplaces, and deep tech — companies with durable, defensible business models
          - generic [ref=f1e120]:
            - strong [ref=f1e121]: Execution-First Teams
            - text: Founders who have built and shipped — engineers, operators, and domain experts over pure visionaries
