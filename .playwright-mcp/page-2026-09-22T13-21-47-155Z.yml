        - generic [ref=f1e186]: For Investors
        - heading "A Differentiated Return Profile. A Differentiated Fund." [level=2] [ref=f1e187]: A Differentiated ReturnProfile. A Differentiated Fund.
        - paragraph [ref=f1e188]: Spanish Founders Platform offers institutional and sophisticated investors a structurally differentiated access point into European venture — with a global expansion thesis that drives premium outcomes.
        - paragraph [ref=f1e189]: Spanish Series A companies have historically been under-valued by the international venture community, creating an asymmetric entry point for investors with the sourcing depth to identify them early. Our fund is designed to capture this mispricing while building a portfolio with inherent diversification across European quality and transatlantic scale.
        - generic [ref=f1e190]:
          - generic [ref=f1e195]:
            - strong [ref=f1e196]: Proprietary Sourcing
            - text: Deep relationships across Spain's top startup ecosystems provide exclusive access to deals that do not appear on international platforms
          - generic [ref=f1e201]:
            - strong [ref=f1e202]: Expansion Multiple
            - text: Series A companies that successfully execute a US or LATAM expansion typically command a 3–5× valuation step-up at their Series B, driving strong fund returns
          - generic [ref=f1e207]:
            - strong [ref=f1e208]: Portfolio Diversification
            - text: Non-correlated to US VC cycles — Spanish companies operate on European fundamentals with global growth upside across two distinct market opportunities
          - generic [ref=f1e213]:
            - strong [ref=f1e214]: Operator GPs
            - text: Fund managers who have built and scaled technology companies bring a perspective that purely financial VCs cannot — driving operational value alongside capital
