  - region [ref=f1e123]:
    - generic [ref=f1e124]:
      - generic [ref=f1e125]:
        - generic [ref=f1e126]: The Opportunity
        - heading "A Structural Advantage No Other Fund Has" [level=2] [ref=f1e127]: A Structural AdvantageNo Other Fund Has
        - paragraph [ref=f1e128]: Spanish founders occupy a unique position at the intersection of Europe's quality, Latin America's growth, and the US's scale. We are the fund built for exactly this moment.
      - generic [ref=f1e129]:
        - generic [ref=f1e130]:
          - generic [ref=f1e131]: "01"
          - heading "The Spanish Ecosystem" [level=3] [ref=f1e132]
          - paragraph [ref=f1e133]: Spain's technology sector has reached critical mass. Madrid and Barcelona now rank among Europe's top five startup hubs, producing world-class engineering talent and an increasing pipeline of B2B companies with €10M+ ARR milestones. Yet Series A capital with transatlantic conviction remains scarce — creating a structural gap we are built to fill.
        - generic [ref=f1e134]:
          - generic [ref=f1e135]: "02"
          - heading "The LATAM Advantage" [level=3] [ref=f1e136]
          - paragraph [ref=f1e137]: 650 million Spanish-speaking consumers across 20 markets represent one of the most underserved and fastest-growing technology opportunities in the world. Spanish founders have native cultural fluency, existing networks, and inherent trust advantages that no non-Spanish company can replicate. LATAM is not a secondary market for them — it is home territory with massive, largely untapped growth potential.
        - generic [ref=f1e138]:
          - generic [ref=f1e139]: "03"
          - heading "The US Gateway" [level=3] [ref=f1e140]
          - paragraph [ref=f1e141]: Miami and New York have emerged as launching pads for Spanish-speaking technology companies targeting the American market. The US Hispanic population of 60M+ is the fastest-growing consumer segment in the country, and enterprise buyers increasingly prize Spanish-speaking operators who understand both markets. Spanish founders are no longer outsiders — they arrive with an unfair advantage built in.
      - blockquote [ref=f1e142]:
        - paragraph [ref=f1e143]: "\"Spanish founders don't choose between Europe, Latin America, and the United States. They are built for all three.\""
        - text: — The Spanish Founders Investment Thesis
  - region [ref=f1e144]:
    - generic [ref=f1e146]:
      - generic [ref=f1e147]:
        - generic [ref=f1e148]: For Founders
        - heading "Capital Is the Beginning, Not the End" [level=2] [ref=f1e149]: Capital Is theBeginning, Not the End
        - paragraph [ref=f1e150]: When you raise from Spanish Founders Platform, you gain more than a check. You gain a dedicated partner who has done what you are trying to do — and a platform built to accelerate your transatlantic journey.
        - paragraph [ref=f1e151]: We work intensively alongside portfolio companies at the critical Series A inflection point — when hiring is hardest, when US market entry decisions are highest-stakes, and when LATAM expansion requires local intelligence you cannot buy. We are the first call, not just a board seat.
        - generic [ref=f1e152]:
          - generic [ref=f1e157]:
            - strong [ref=f1e158]: US Market Entry Support
            - text: Warm introductions to US enterprise buyers, distribution partners, and the right Series B investors across New York and the Bay Area
          - generic [ref=f1e163]:
            - strong [ref=f1e164]: LATAM Network
            - text: A curated ecosystem of operators, distributors, and fund partners across Mexico, Colombia, Brazil, and Argentina
          - generic [ref=f1e169]:
            - strong [ref=f1e170]: Founder Community
            - text: Access to a private network of Spanish founders who have scaled globally — peers who have navigated exactly what you are facing
          - generic [ref=f1e175]:
            - strong [ref=f1e176]: Follow-on Path
            - text: We actively support portfolio companies in securing Series B capital from US and international investors through our LP and co-investor network
        - link "Tell Us About Your Company" [ref=f1e177] [cursor=pointer]:
